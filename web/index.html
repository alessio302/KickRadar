<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Experiment, 2026-09-11 (reversible -- see git history for the
         viewport-fit=cover version this replaces): dropped viewport-fit=
         cover after a second project's own working PWA turned out to have
         NONE of the env(safe-area-inset-*) code this file/App.jsx/
         BottomNav.jsx use, on purpose. Per WebKit's own documented
         behavior, viewport-fit's default (effectively "contain" when
         omitted) constrains the LAYOUT VIEWPORT ITSELF to the safe area,
         rather than the page opting into extending full-screen and then
         being responsible for env()-padding around the notch/home
         indicator itself. That's a genuinely different mechanism from
         anything tried in this file's own prior investigation (100dvh ->
         100svh -> 100%), all of which only ever varied the height unit
         *inside* an already-full-screen (cover) viewport -- none of them
         could have reached this. Every env(safe-area-inset-*) call already
         in this codebase (App.jsx's top spacer, BottomNav.jsx's bottom
         padding) needs no code change either way: per spec those all
         resolve to 0px once viewport-fit isn't "cover", so they degrade to
         plain fixed padding for free instead of double-counting.
         Real tradeoff worth watching for on the live retest, not just the
         home-indicator gap: black-translucent below relies on page content
         actually extending under the status bar to have anything to show
         through -- without cover, that may revert to iOS's own default
         (opaque) status bar rendering regardless of this meta tag's own
         value, since there's no longer any content back there for
         "translucent" to blend with. Revert this one line (add back
         `, viewport-fit=cover`) if the bottom fix isn't worth losing that. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0D10" />
    <!-- Confirmed live (pre-experiment): without these two, iOS draws the
         status bar area as its own opaque white bar instead of letting the
         app's own background (App.jsx already pads for
         env(safe-area-inset-top), exactly anticipating this) show through
         underneath it. black-translucent makes it transparent with light
         system icons/text -- App.jsx flips this to "default" (opaque, dark
         icons) at runtime when the resolved theme is light, since
         translucent would otherwise put white status-bar text on a light
         background. See this file's own viewport-fit comment above for why
         this effect specifically may no longer apply now. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Matches the logo's display font (the app icon uses a licensed
         Canva-catalog font, "Adriana", not freely embeddable in a web app --
         Orbitron is a free, license-clear Google Font with the same bold,
         geometric, tech/radar-ish letterforms, used for the "KickRadar"
         header title only). Inter is the redesign's own UI typeface (per
         the design exports' own @font-face rules) -- used for everything
         else, see App.jsx's root fontFamily. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>KickRadar</title>
    <style>
      /* App-shell layout (see App.jsx): only the content area between
         header and bottom nav scrolls, not the page itself. Needs
         html/body/#root to actually fill the viewport height with no
         default margin, or the browser's own UA stylesheet (body has an
         8px margin by default) adds page-level scroll of its own. */
      html, body, #root {
        height: 100%;
        margin: 0;
      }

      /* Confirmed live: pulling down inside a scrolled-to-top content area
         (e.g. TransfersTab's pull-to-refresh) dragged the *entire page*
         down, revealing blank space above the header -- the browser's own
         native overscroll bounce, triggered on the touched element and
         then chaining all the way up to the document, since
         overscroll-behavior: contain on that one element only stops
         chaining, it doesn't suppress the element's own bounce glow.
         Blocking it at the document root kills the native effect
         everywhere at once so every scroll area's own fixed header/nav
         actually stays put, not just the one that happened to set contain. */
      html, body {
        overscroll-behavior: none;
      }

      /* Nothing in the app should be selectable/copyable -- no text input
         fields exist anywhere in the UI (confirmed: no <input>/<textarea>
         in web/src), so a blanket rule needs no per-field exception.
         -webkit-touch-callout additionally suppresses iOS's long-press
         "Copy"/"Save Image" callout menu, which user-select alone doesn't
         cover. */
      html, body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* Static pre-hydration fallback for the same gap App.jsx's effect
         fixes at runtime (a bottom-safe-area sliver falling back to the
         browser's default white before React has mounted) -- matches
         resolved theme via the OS preference since darkModeSetting's own
         "system" default isn't known this early. App.jsx's effect
         immediately overrides this once mounted, including for an
         explicit light/dark choice that disagrees with the OS. */
      html, body {
        background: #F5F5F2;
      }
      @media (prefers-color-scheme: dark) {
        html, body {
          background: #0B0D10;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
