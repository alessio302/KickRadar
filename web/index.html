<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- No viewport-fit=cover, 2026-09-11 -- re-applied deliberately despite
         its own earlier round-trip in this file's git history measuring
         ZERO effect on the underlying 47px unreachable-zone gap
         (window.innerHeight/visualViewport.height/screen.height all stayed
         exactly what they were with cover set too, confirmed live via a
         temporary ViewportDebugOverlay). Kept off anyway per explicit
         request, alongside switching BottomNav.jsx back to a flush,
         edge-to-edge bar (no floating pill, no rounded corners) -- that
         shape has nothing for the lack of env(safe-area-inset-bottom)
         padding to visibly clip into the way the pill's own rounded
         corners did, so the earlier regression that came from dropping
         cover doesn't apply to this shape. Re-adding
         `, viewport-fit=cover` here is still safe/reversible if a future
         change (rounded corners, inset margins) brings that class of
         clipping back. Confirmed live 2026-09-11 (real device, standalone
         iOS PWA): both the status bar up top and the flush bottom nav
         render cleanly this way, user-approved -- settled state, not an
         open experiment. -->
    <!-- maximum-scale=1, user-scalable=no: this is an app shell with its
         own fixed header/bottom-nav layout, not a document meant to be
         zoomed -- pinch-zoom breaking that layout is a bug, not a missing
         accessibility affordance (nothing here relies on native page zoom
         to be readable; text sizing is already fixed by the design). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0B0D10" />
    <!-- Confirmed live: without these two, iOS draws the status bar area
         as its own opaque white bar instead of letting the app's own
         background (App.jsx already pads for env(safe-area-inset-top),
         exactly anticipating this) show through underneath it.
         black-translucent makes it transparent with light system icons/
         text -- App.jsx flips this to "default" (opaque, dark icons) at
         runtime when the resolved theme is light, since translucent would
         otherwise put white status-bar text on a light background. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Matches the logo's display font (the app icon uses a licensed
         Canva-catalog font, "Adriana", not freely embeddable in a web app --
         Orbitron is a free, license-clear Google Font with the same bold,
         geometric, tech/radar-ish letterforms, used for the "KickRadar"
         header title only). Inter is the redesign's own UI typeface (per
         the design exports' own @font-face rules) -- used for everything
         else, see App.jsx's root fontFamily. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>KickRadar</title>
    <style>
      /* App-shell layout (see App.jsx): only the content area between
         header and bottom nav scrolls, not the page itself. Needs
         html/body/#root to actually fill the viewport height with no
         default margin, or the browser's own UA stylesheet (body has an
         8px margin by default) adds page-level scroll of its own. */
      html, body, #root {
        height: 100%;
        margin: 0;
      }

      /* Confirmed live: pulling down inside a scrolled-to-top content area
         (e.g. TransfersTab's pull-to-refresh) dragged the *entire page*
         down, revealing blank space above the header -- the browser's own
         native overscroll bounce, triggered on the touched element and
         then chaining all the way up to the document, since
         overscroll-behavior: contain on that one element only stops
         chaining, it doesn't suppress the element's own bounce glow.
         Blocking it at the document root kills the native effect
         everywhere at once so every scroll area's own fixed header/nav
         actually stays put, not just the one that happened to set contain. */
      html, body {
        overscroll-behavior: none;
      }

      /* Belt-and-suspenders against pinch-zoom on top of the viewport
         meta's maximum-scale/user-scalable above -- iOS Safari (including
         standalone PWAs) has ignored user-scalable=no for pinch gestures
         specifically since iOS 10's accessibility change, so the meta tag
         alone doesn't reliably block it there; touch-action does. pan-x
         pan-y (not the bare "manipulation" keyword, which still permits
         pinch-zoom) keeps panning/scrolling and tap responsiveness intact
         everywhere else in the app while dropping pinch-zoom and
         double-tap-to-zoom specifically. */
      html, body {
        touch-action: pan-x pan-y;
      }

      /* Nothing in the app should be selectable/copyable -- no text input
         fields exist anywhere in the UI (confirmed: no <input>/<textarea>
         in web/src), so a blanket rule needs no per-field exception.
         -webkit-touch-callout additionally suppresses iOS's long-press
         "Copy"/"Save Image" callout menu, which user-select alone doesn't
         cover. */
      html, body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* Static pre-hydration fallback for the same gap App.jsx's effect
         fixes at runtime (a bottom-safe-area sliver falling back to the
         browser's default white before React has mounted) -- matches
         resolved theme via the OS preference since darkModeSetting's own
         "system" default isn't known this early. App.jsx's effect
         immediately overrides this once mounted, including for an
         explicit light/dark choice that disagrees with the OS. */
      html, body {
        background: #F5F5F2;
      }
      @media (prefers-color-scheme: dark) {
        html, body {
          background: #0B0D10;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
