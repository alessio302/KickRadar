name: Diagnose Bonny transfer card (one-off)

# User-reported bad card: "Ange-Yoan Bonny, Parma -> Fiorentina" shown as
# a rumor, but the user says Bonny currently plays for Inter. Read-only,
# no writes. See src/news/diagnoseBonny.js.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/diagnoseBonny.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
