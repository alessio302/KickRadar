name: News articles scraper

on:
  schedule:
    # 15-min cadence, per the RSS-feed research's own recommendation
    # (5-15 min polling for these sources) -- unlike the transfer scraper,
    # general match-report/news coverage isn't seasonal (no closed transfer
    # window), so this runs year-round at a steady interval.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 20 min: same Gemini free-tier throttle (6.5s/call) as the transfers
    # scraper -- a large first-run backlog across 9 sources can take a
    # while; steady-state 15-min runs (only genuinely new items) finish
    # well under a minute.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/runGeneralNewsScraper.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
