name: European lineups sync

on:
  schedule:
    # Same 15-min cadence as lineups-sync.yml, offset to :10/:25/:40/:55 so
    # it doesn't share a literal cron pattern with any other workflow --
    # see lineups-sync.yml's own comment on why that offset matters
    # (GitHub Actions throttled three workflows sharing "*/15 * * * *"
    # hard, confirmed live). Cheap on non-matchdays: with no fixture in the
    # near-kickoff/finished-recent window, the job returns after its
    # Supabase queries without spending any GOAL API budget.
    - cron: '10,25,40,55 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/lineups/syncEuropeanLineups.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          # Added 2026-09-12 alongside this file's own new match-events sync
          # (brought in line with lineups-sync.yml, which already had these):
          # without them, notifyFavoritedFixtureEvents()'s own push attempt
          # for a European goal/card/sub throws "Missing VAPID_PUBLIC_KEY/
          # VAPID_PRIVATE_KEY env vars" on every single call -- caught and
          # logged, not fatal to the run, but push notifications for
          # UCL/UEL/UECL match events would otherwise never actually work.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
