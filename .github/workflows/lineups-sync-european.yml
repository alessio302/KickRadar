name: European lineups sync

on:
  schedule:
    # Same 15-min cadence as lineups-sync.yml, offset to :10/:25/:40/:55 so
    # it doesn't share a literal cron pattern with any other workflow --
    # see lineups-sync.yml's own comment on why that offset matters
    # (GitHub Actions throttled three workflows sharing "*/15 * * * *"
    # hard, confirmed live). Cheap on non-matchdays: with no fixture in the
    # near-kickoff/finished-recent window, the job returns after its
    # Supabase queries without spending any GOAL API budget.
    - cron: '10,25,40,55 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/lineups/syncEuropeanLineups.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
