name: Diagnose Highlightly API (one-off)

# Smoke test before building the confirmed-lineups feature on top of
# Highlightly's free plan -- see src/lineups/diagnoseHighlightly.js for
# why this needs checking live before any real integration work.
# Read-only, no DB writes. Manual trigger only.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/lineups/diagnoseHighlightly.js
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
