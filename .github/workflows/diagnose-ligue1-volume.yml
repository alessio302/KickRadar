name: Diagnose Ligue 1 volume (one-off)

# Checks how much smaller Ligue 1's actual DB volume is than the other
# leagues -- see src/news/diagnoseLigue1Volume.js. Companion to the
# pre-existing diagnose-source-volume.yml, which re-checks rmcsport's raw
# fetch + relevance.js pass rate live. Read-only, no DB writes.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/diagnoseLigue1Volume.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
