name: Fix transfer directions (one-off)

# One-off corrective pass (see src/football-api/fixTransferDirections.js)
# -- manual trigger only. Applies the squad-based direction check to
# transfers stored before squad_memberships existed. Run once after the
# initial squads-sync.yml run.
on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/fixTransferDirections.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
