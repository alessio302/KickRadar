name: European highlights sync

on:
  schedule:
    # Every 30 min like highlights-sync.yml, offset to :05/:35 -- distinct
    # from every other workflow's cron minutes in this repo (checked all of
    # them before picking this: news-scraper's old 4/34, live-events'
    # 4/19/34/49, live-scores' 9/24/39/54, lineups-sync's 14/29/44/59,
    # lineups-sync-european's 10/25/40/55, highlights-sync's 7/37,
    # head-to-head-sync's 40, standings-sync's 20, fixture-reminders'
    # 2/7/12/17/22/27/32/37/42/47/52/57, schedule-watchdog's 50,
    # player-profile-refresh's 49). See highlights-sync.yml's own comment
    # on why this matters: several workflows sharing one cron pattern made
    # GitHub Actions' scheduler throttle all of them hard.
    - cron: '5,35 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/lineups/syncEuropeanHighlights.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
