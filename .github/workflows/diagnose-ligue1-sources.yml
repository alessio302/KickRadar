name: Diagnose Ligue 1 source candidates (one-off)

# Looks for a more Ligue-1-focused replacement for rmcsport.js -- see
# src/news/diagnoseLigue1Sources.js. Read-only, no DB writes, no secrets
# needed (just live HTTP fetches). Manual trigger only.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/diagnoseLigue1Sources.js
