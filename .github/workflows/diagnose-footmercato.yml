name: Diagnose Foot Mercato source (one-off)

# Verifies footmercato.js's fetchLatest() output end-to-end (item count,
# title cleaning, dedup) before trusting it in the real hourly scraper --
# see src/news/diagnoseFootmercato.js. Read-only, no DB writes, no secrets
# needed. Manual trigger only.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/diagnoseFootmercato.js
