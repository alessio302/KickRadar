name: European fixtures full sync (weekly)

on:
  schedule:
    # Weekly, not daily -- this is the wide ±7d/+60d window
    # (syncEuropeanFixtures.js's own default before 2026-09-09) that the
    # daily sync-european-fixtures.yml run no longer covers. Only exists to
    # catch a matchday reschedule/kickoff-time change further out than the
    # daily run's narrow window reaches; that's rare enough that once a
    # week is plenty, rather than paying the full 134-call cost daily.
    - cron: '0 6 * * 0'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/syncEuropeanFixtures.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          EUROPEAN_FIXTURES_FULL_SYNC: 'true'
