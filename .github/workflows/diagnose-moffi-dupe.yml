name: Diagnose Moffi transfer duplicate (one-off)

# Checks a reported duplicate transfer card (Terem Moffi, "OGC Nizza" vs
# "OGC Nice") -- see src/news/diagnoseMoffiDupe.js. Read-only, no DB
# writes. Manual trigger only.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/diagnoseAllClubNames.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
