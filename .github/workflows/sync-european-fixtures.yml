name: European fixtures sync

on:
  schedule:
    # Once daily (07:00 UTC), not 2x/day -- dropped from 2x/day (2026-09-09):
    # 2 competitions' worth of GOAL API calls per run was a meaningful share
    # of several days that ran over the shared 1000/day cap, confirmed
    # against this project's own goal_api_usage table. The 16:00 UTC run
    # only existed to catch a same-day kickoff-time publication a few hours
    # earlier than the next morning's run would anyway.
    #
    # This run uses the narrow default date window (see
    # syncEuropeanFixtures.js's own top comment) -- today's results plus the
    # next couple weeks' schedule, not the full ±7d/+60d range. See
    # sync-european-fixtures-full.yml for the weekly wide-window run that
    # still catches a reschedule further out.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/syncEuropeanFixtures.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
