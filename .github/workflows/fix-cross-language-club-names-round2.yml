name: Fix cross-language club names round 2 (one-off)

# Second pass -- the first alias sweep this session missed several real
# exonyms (reported: "Estrasburgo" for RC Strasbourg Alsace leaking
# through in a LaLiga card). See
# src/news/fixCrossLanguageClubNamesRound2.js for the full list and
# reasoning. Writes to clubs.aliases and transfers -- manual trigger
# only, deleted after the fix is applied and confirmed.
on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/fixCrossLanguageClubNamesRound2.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
