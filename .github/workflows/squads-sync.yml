name: Squads sync

on:
  schedule:
    # Weekly, not daily -- this data's only scheduled consumer,
    # runNewsScraper.js's transfer-direction resolution, itself only runs
    # once a week (news-scraper.yml: Monday 03:00 UTC), so a squad sync
    # more often than that can never actually be used more often than
    # that. Scheduled 1h ahead of it (Monday 02:00 UTC) so this week's
    # transfers are reflected before the scraper reads squad_memberships,
    # with real headroom over this job's own ~10-minute runtime.
    - cron: '0 2 * * 1'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    # ~95 clubs across 5 leagues at ~6.5s/request (free tier: 10 req/min)
    # takes roughly 10 minutes end to end.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/syncSquads.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
