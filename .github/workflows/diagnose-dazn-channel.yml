name: Diagnose DAZN UCL channel (temporary)

on:
  workflow_dispatch:
    inputs:
      channel_id:
        required: false
        default: 'UCB-GdMjyokO9lZkKU_oIK6g'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/lineups/diagnoseDaznChannel.js
        env:
          CHANNEL_ID: ${{ github.event.inputs.channel_id }}
