name: Diagnose live matches endpoint (one-off)

# Read-only: confirms football-data.org's global /v4/matches endpoint
# works with a multi-competition + status=LIVE filter in one request. No
# DB access, no writes. Manual trigger only, to be deleted after use.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/diagnoseLiveMatches.js
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
