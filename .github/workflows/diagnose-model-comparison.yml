name: Diagnose model comparison

# TEMPORARY diagnostic workflow -- workflow_dispatch only, never scheduled.
# Delete this file (and src/news/diagnoseModelComparison.js) once the
# gemini-3.5-flash-lite vs gemini-3.6-flash comparison is done.
on:
  workflow_dispatch: {}

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/diagnoseModelComparison.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
