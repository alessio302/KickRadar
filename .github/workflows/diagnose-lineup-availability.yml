name: Diagnose lineup availability

# workflow_dispatch only -- no schedule. Polls GOAL API's lineups endpoint
# once a minute for fixtures kicking off around now and logs when each one
# first publishes starting XIs. See diagnoseLineupAvailability.js.

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/lineups/diagnoseLineupAvailability.js
        env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
