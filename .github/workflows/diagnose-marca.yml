name: Diagnose Marca source (one-off)

# Confirms marca.com's DOM structure for the "Mercado de Fichajes" section
# before committing to a real selector in src/news/sources/marca.js -- see
# src/news/diagnoseMarca.js. Read-only, no DB writes, no secrets needed.
# Manual trigger only.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/diagnoseMarca.js
