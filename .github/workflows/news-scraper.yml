name: News scraper

on:
  schedule:
    # Every 30 min, not 15 -- per user's own call: at 15 min, a lot of runs
    # simply find nothing new. Gemini calls scale with how many genuinely
    # new items exist, not with how often this runs, so the shorter
    # interval wasn't costing extra API calls, just extra empty runs.
    #
    # Offset to :04/:34, not the round :00/:30 marks -- confirmed live:
    # this workflow, live-scores.yml and lineups-sync.yml all sharing the
    # literal "*/15 * * * *" pattern meant three scheduled runs queuing at
    # the exact same instant, every 15 minutes, all day. GitHub Actions'
    # scheduler is documented best-effort and deprioritizes exactly this
    # kind of same-tick contention -- confirmed via actual run history:
    # average gap ended up ~70 min instead of 15, with individual gaps up
    # to 5+ hours. Staggering the workflows' minutes apart is the standard
    # mitigation for this, and still applies at 30 min: :04/:34 doesn't
    # collide with live-scores' :09/:24/:39/:54 or lineups-sync's
    # :14/:29/:44/:59. For an HTML-scraped source with a bounded "latest N"
    # list (marca.js, footmercato.js), a long enough gap during a busy news
    # day can still let a genuinely new item scroll off the list before any
    # run ever sees it -- worth knowing this raises that risk somewhat
    # versus 15 min, though real-world gaps were already averaging ~70 min
    # even at the old nominal 15-min setting, so 30 min mostly matches
    # observed reality rather than meaningfully widening it.
    - cron: '4,34 * * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 20 min: the Gemini free-tier throttle (15 req/min) means a large
    # backlog of new items -- e.g. after a `truncate table transfers` --
    # can take several minutes to clear. Steady-state hourly runs (only
    # genuinely new items get processed) finish in well under a minute.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/backfillGoalApiProfiles.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
