name: News scraper

on:
  schedule:
    # Hourly, per the briefing ("ca. stündlich" for news scraping).
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 20 min: the Gemini free-tier throttle (15 req/min) means a large
    # backlog of new items -- e.g. after a `truncate table transfers` --
    # can take several minutes to clear. Steady-state hourly runs (only
    # genuinely new items get processed) finish in well under a minute.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/runNewsScraper.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
