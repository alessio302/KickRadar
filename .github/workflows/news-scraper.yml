name: News scraper

on:
  schedule:
    # SEASONAL THROTTLE (2026-09-06, per user request): the summer window
    # closed ~Sept 1 and the next one (winter, opens Jan 1) is months out --
    # transfer news volume drops to near zero in between, so the normal
    # 30-min cadence was mostly empty runs burning GitHub Actions minutes
    # for nothing. Dropped to once a week for this dead period; a scheduled
    # reminder (self-fired into this Claude session, ~a few weeks before
    # the Jan 1 window) prompts switching this back to the line below.
    # Monday 03:00 UTC -- arbitrary low-traffic slot, doesn't collide with
    # any other workflow's own offset.
    #
    # Normal in-window cadence (restore verbatim when re-enabling):
    #   - cron: '4,34 * * * *'
    # That comment's own reasoning (why 30 not 15 min, why :04/:34 not
    # :00/:30) still applies unchanged once restored.
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 20 min: the Gemini free-tier throttle (15 req/min) means a large
    # backlog of new items -- e.g. after a `truncate table transfers` --
    # can take several minutes to clear. Steady-state hourly runs (only
    # genuinely new items get processed) finish in well under a minute.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/runNewsScraper.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
