name: News scraper

on:
  schedule:
    # Every 15 min, not hourly -- only safe to run this often because the
    # repo is public (unlimited GitHub Actions minutes; a private repo's
    # free 2,000 min/month was already at risk of being exceeded by
    # lineups-sync's own 15-min cadence alone, see its own comment).
    # Gemini calls scale with how many genuinely new items exist, not with
    # how often this runs -- seen_news_items already dedupes those, so a
    # shorter interval mostly means fewer new items per run, not more
    # total calls per day.
    #
    # Offset to :04/:19/:34/:49, not the round :00/:15/:30/:45 marks --
    # confirmed live: this workflow, live-scores.yml and lineups-sync.yml
    # all sharing the literal "*/15 * * * *" pattern meant three scheduled
    # runs queuing at the exact same instant, every 15 minutes, all day.
    # GitHub Actions' scheduler is documented best-effort and deprioritizes
    # exactly this kind of same-tick contention -- confirmed via actual run
    # history: average gap ended up ~70 min instead of 15, with individual
    # gaps up to 5+ hours. For an HTML-scraped source with a bounded
    # "latest N" list (marca.js, footmercato.js), that's not just "later" --
    # a long enough gap during a busy news day can let a genuinely new item
    # scroll off the list before any run ever sees it, i.e. permanently
    # missed, not just delayed. Staggering the three workflows' minutes
    # apart is the standard mitigation for this.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 20 min: the Gemini free-tier throttle (15 req/min) means a large
    # backlog of new items -- e.g. after a `truncate table transfers` --
    # can take several minutes to clear. Steady-state hourly runs (only
    # genuinely new items get processed) finish in well under a minute.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/runNewsScraper.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
