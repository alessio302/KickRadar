name: Player profiles sync

on:
  schedule:
    # Once daily, not every 6h -- confirmed live (2026-09-09, this
    # project's own goal_api_usage table) that "well within the shared
    # 1000/day budget" below was wrong: this run's own cost is up to 156
    # GOAL API calls (96 clubs' squad fetches, unconditional and with no
    # per-club staleness check, plus up to MAX_GAP_FILLS_PER_RUN x 2
    # gap-fill calls) x 4 runs/day = up to 624/day, on a fixed clock with
    # no connection to whether any tracked league actually has a match in
    # progress -- confirmed the dominant, day-independent cost against
    # actual daily totals (several days over the 1000/day cap entirely,
    # a quiet non-matchday still at 872 by mid-afternoon). Squad rosters
    # and injury/stat snapshots don't need same-day-multiple-times
    # freshness; once daily still refreshes every tracked club's data at
    # least once every 24h, at a quarter of the previous cost (up to
    # ~156/day instead of ~624/day).
    - cron: '25 5 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    # ~96 clubs x ~20-30 players each (~2000+ total), one DB write per
    # player -- confirmed live a full pass takes well over 20 minutes at
    # roughly one player per second (sequential DB round trips, plus any
    # GOAL API retry backoff along the way). Now also fetches each club's
    # real squad from football-data.org (rate-limited to 10 req/min, ~6.5s
    # spacing -- ~10 more minutes across ~96 clubs) and, for any player
    # that turns up missing from GOAL API's own squad response, an
    # additional throttled GOAL API search (up to MAX_GAP_FILLS_PER_RUN of
    # those, ~13s each). 90 minutes leaves real headroom for a worst-case
    # run so it covers every club rather than stalling partway through.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/lineups/syncPlayerProfiles.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
