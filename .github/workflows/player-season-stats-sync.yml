name: Player season stats sync

on:
  schedule:
    # Once per day, right after the top scorers sync (02:00 UTC) since both
    # aggregate from the same match_events data -- purely a DB read/write
    # job, no external API budget involved.
    - cron: '15 2 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/syncPlayerSeasonStats.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
