name: Diagnose Vitinha/Rennes mismatch timing (one-off)

# Checks whether the newly-reported Vitinha (PSG -> Stade Rennais) card
# predates the bare-single-word-name squad-correction guard (commit
# 8729f52) or was written after it. See src/news/diagnoseVitinhaRennes.js.
# Read-only, no DB writes.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/diagnoseVitinhaRennes.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
