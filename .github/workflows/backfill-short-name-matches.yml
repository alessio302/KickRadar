name: Backfill short_name club matches (one-off)

# Backfills from_club_id/to_club_id on existing transfer rows now that
# resolveClub() also matches a club's short_name (see
# src/news/backfillShortNameMatches.js), and merges the duplicates that
# gap already produced. Writes to transfers -- manual trigger only,
# deleted after the fix is applied and confirmed.
on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/backfillShortNameMatches.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
