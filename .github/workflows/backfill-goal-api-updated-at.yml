name: Backfill goal_api_updated_at (one-off)

on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 83 players x ~6.5s GOAL API spacing (1 call each) is ~9 min; generous
    # headroom for retries during a busy rate-limit window.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/backfillGoalApiUpdatedAt.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
