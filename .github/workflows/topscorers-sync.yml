name: Top scorers sync

on:
  schedule:
    # Once per day at 02:00 UTC. Aggregates from our own match_events
    # table (see syncTopScorers.js's own comment on why that replaced
    # GOAL API's squad-embedded stats) -- no external API budget involved
    # any more, just DB reads, so this cadence is purely "often enough to
    # feel current" rather than a rate-limit constraint. Could safely run
    # more often if that ever matters.
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/syncTopScorers.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
