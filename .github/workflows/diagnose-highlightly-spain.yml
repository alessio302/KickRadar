name: Diagnose Highlightly for La Liga (one-off)

# Confirms Highlightly's league.name for La Liga before relying on it in
# src/lineups/syncLineups.js's HIGHLIGHTLY_LEAGUE_NAME map -- see
# src/lineups/diagnoseHighlightlySpain.js. Read-only, no DB writes.
# Manual trigger only.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/lineups/diagnoseHighlightlySpain.js
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
