name: Diagnose DAZN UCL playlist (temporary)

on:
  workflow_dispatch:
    inputs:
      playlist_id:
        required: false
        default: 'PLWfYkOV-XnPA'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/lineups/diagnoseDaznPlaylist.js
        env:
          PLAYLIST_ID: ${{ github.event.inputs.playlist_id }}
