name: Schedule watchdog

# GitHub Actions' own scheduled-trigger delivery has been unreliable for
# this repo -- confirmed live on 2026-08-28: news-scraper.yml, lineups-
# sync.yml, live-scores.yml and fixtures-sync.yml all silently stopped
# firing on their own schedule for 15+ hours despite being "active"
# workflows with no code/secrets problem; a manual workflow_dispatch
# worked fine every single time and pulled in real new data. GitHub
# documents scheduled triggers as best-effort, and this is outside
# anything fixable in our own code.
#
# This watchdog checks ALL of the time-critical workflows below (each
# against its own staleness threshold) and re-triggers any that look
# suspiciously stale. Originally scoped to news-scraper.yml only; widened
# after the same outage hit lineups-sync/live-scores/fixtures-sync at the
# same time, so one watchdog run now covers the whole set instead of
# needing a separate one per workflow.
#
# live-events.yml (added later, in the live-event-push stage) was never
# added here -- confirmed live it went completely dark for well over an
# hour spanning a real match's kickoff, with nothing catching it, since it
# was relying solely on GitHub's own unreliable scheduler with no safety
# net. Same threshold as lineups-sync.yml below: same 15-min native cadence.
#
# This watchdog's own schedule is subject to the identical GitHub
# reliability issue -- it isn't a way around the root cause, since nothing
# we control is. That's why it's also wired up to be triggered externally:
# an external cron service (outside GitHub entirely) hits this workflow's
# workflow_dispatch via the GitHub API on a short interval, so this job
# still runs even during a total GitHub Actions scheduler outage like
# today's. Whenever it *does* run, even hours late, it immediately catches
# up regardless of how long the gap was, rather than depending on a person
# noticing and re-running things by hand.
#
# Offset to :50 -- doesn't collide with news-scraper's own :04/:34,
# live-scores' :09/:24/:39/:54, or lineups-sync's :14/:29/:44/:59.
on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check last successful runs and re-trigger any that are stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          REF="${{ github.ref_name }}"

          check_and_trigger() {
            local workflow="$1"
            local threshold_min="$2"
            local last_run
            # No event=schedule filter here -- a successful run is a
            # successful run, whatever triggered it. Confirmed live: with
            # the filter, this kept comparing against the last run GitHub's
            # own (broken) scheduler happened to fire, so it re-dispatched
            # on every single watchdog tick even seconds after this exact
            # function had just dispatched a successful run itself --
            # harmless (syncLineups.js etc. are idempotent) but pointless.
            last_run=$(gh api "repos/$REPO/actions/workflows/$workflow/runs?status=success&per_page=1" --jq '.workflow_runs[0].created_at // empty')

            if [ -z "$last_run" ]; then
              echo "$workflow: no prior successful run found -- skipping."
              return
            fi

            local last_epoch now_epoch gap_min
            last_epoch=$(date -u -d "$last_run" +%s)
            now_epoch=$(date -u +%s)
            gap_min=$(( (now_epoch - last_epoch) / 60 ))
            echo "$workflow: last successful run $last_run ($gap_min min ago, threshold ${threshold_min}m)"

            if [ "$gap_min" -gt "$threshold_min" ]; then
              echo "$workflow: gap exceeds threshold -- dispatching manually."
              gh workflow run "$workflow" --repo "$REPO" --ref "$REF"
            else
              echo "$workflow: gap is within the normal range -- nothing to do."
            fi
          }

          # Threshold = own cadence + slack for a run landing a bit late.
          #
          # live-scores.yml is the exception: it self-loops for up to 13
          # minutes straight while a match is live (see JOB_BUDGET_MS in
          # syncLiveScores.js), and "last successful run" here means that
          # run's *start* time, not when it finished. Confirmed live
          # (Bayern-Stuttgart, 2026-08-28): with a 25-min threshold, a run
          # that started at :00 and finished at :13 wasn't seen as stale
          # again until :25+ -- a real ~16-minute gap with nobody polling,
          # right as the match hit its 5th goal and full time. A much
          # tighter threshold (just over the run's own ~13-min duration)
          # costs nothing on quiet days -- live-scores.yml exits in ~1-2s
          # when nothing is live -- so there's no reason not to check it
          # aggressively.
          check_and_trigger news-scraper.yml 50     # cadence 30 min
          check_and_trigger lineups-sync.yml 25     # cadence 15 min
          check_and_trigger live-events.yml 25      # cadence 15 min
          check_and_trigger live-scores.yml 14      # self-loops ~13 min while live; see comment above
          check_and_trigger fixtures-sync.yml 400   # cadence 360 min (4x/day)
          check_and_trigger highlights-sync.yml 50  # cadence 30 min
