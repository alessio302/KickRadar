name: Schedule watchdog

# GitHub Actions' own scheduled-trigger delivery has been unreliable for
# this repo -- confirmed live on 2026-08-28: news-scraper.yml, lineups-
# sync.yml, live-scores.yml and fixtures-sync.yml all silently stopped
# firing on their own schedule for 15+ hours despite being "active"
# workflows with no code/secrets problem; a manual workflow_dispatch
# worked fine every single time and pulled in real new data. GitHub
# documents scheduled triggers as best-effort, and this is outside
# anything fixable in our own code.
#
# This watchdog checks ALL of the time-critical workflows below (each
# against its own staleness threshold) and re-triggers any that look
# suspiciously stale. Originally scoped to news-scraper.yml only; widened
# after the same outage hit lineups-sync/live-scores/fixtures-sync at the
# same time, so one watchdog run now covers the whole set instead of
# needing a separate one per workflow.
#
# live-events.yml (added later, in the live-event-push stage) was never
# added here -- confirmed live it went completely dark for well over an
# hour spanning a real match's kickoff, with nothing catching it, since it
# was relying solely on GitHub's own unreliable scheduler with no safety
# net. Originally given lineups-sync.yml's own 25min/15min-cadence
# threshold, which turned out to be the wrong template: like live-scores.yml
# below, this job self-loops for ~14 minutes straight while a match is live
# (see JOB_BUDGET_MS in syncLiveEvents.js) rather than running once and
# exiting, so it needed live-scores.yml's tighter "just over its own
# self-loop duration" threshold instead -- confirmed live 2026-09-12 that
# 25min let a real match go 16+ minutes with zero WS coverage (a missed
# goal, a frozen live minute) after one run ended, well before either
# GitHub's scheduler or this watchdog's own next hourly tick caught it.
#
# live-scores-european.yml (added 2026-09-10, same outage this whole
# comment documents) had the exact same gap: confirmed live it fired
# exactly once ever -- the manual workflow_dispatch that added it -- and
# never again on its own native schedule, leaving 3 live CL fixtures stuck
# on a 20-minutes-stale score for the rest of their match with nobody
# catching it, the very failure mode this watchdog exists for. Same
# reasoning and threshold as live-scores.yml below (self-loops ~13 min
# while live; checked aggressively since it's nearly free when nothing's
# live).
#
# fixture-reminders.yml was never added here either, despite being on the
# tightest native cron of anything in this repo (every 5 min) -- confirmed
# live 2026-09-18 via run history: actual gaps between successful runs hit
# 2h43m, 3h48m and 4h46m that same day, the same GitHub scheduler
# unreliability this whole file exists for, just never wired up for this
# workflow. This is the one job with zero tolerance for a multi-hour gap:
# it's solely responsible for the 30/15-minute-before-kickoff push (see its
# own WINDOW_SLACK_MS -- a +-5min window around each target), so a gap even
# a bit wider than that silently drops a reminder with no other path ever
# recovering it (unlike goals/lineups, which live-events.yml/lineups-
# sync.yml would still eventually pick up). Threshold of 10 (double the
# 5-min cadence) tolerates one missed native tick before re-triggering.
#
# This watchdog's own schedule is subject to the identical GitHub
# reliability issue -- it isn't a way around the root cause, since nothing
# we control is. That's why it's also wired up to be triggered externally:
# an external cron service (outside GitHub entirely) hits this workflow's
# workflow_dispatch via the GitHub API on a short interval, so this job
# still runs even during a total GitHub Actions scheduler outage like
# today's. Whenever it *does* run, even hours late, it immediately catches
# up regardless of how long the gap was, rather than depending on a person
# noticing and re-running things by hand.
#
# Offset to :50 -- doesn't collide with news-scraper's own :04/:34,
# live-scores' :09/:24/:39/:54, or lineups-sync's :14/:29/:44/:59.
on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check last successful runs and re-trigger any that are stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          REF="${{ github.ref_name }}"

          check_and_trigger() {
            local workflow="$1"
            local threshold_min="$2"
            local last_run
            # No event=schedule filter here -- a successful run is a
            # successful run, whatever triggered it. Confirmed live: with
            # the filter, this kept comparing against the last run GitHub's
            # own (broken) scheduler happened to fire, so it re-dispatched
            # on every single watchdog tick even seconds after this exact
            # function had just dispatched a successful run itself --
            # harmless (syncLineups.js etc. are idempotent) but pointless.
            last_run=$(gh api "repos/$REPO/actions/workflows/$workflow/runs?status=success&per_page=1" --jq '.workflow_runs[0].created_at // empty')

            if [ -z "$last_run" ]; then
              echo "$workflow: no prior successful run found -- skipping."
              return
            fi

            local last_epoch now_epoch gap_min
            last_epoch=$(date -u -d "$last_run" +%s)
            now_epoch=$(date -u +%s)
            gap_min=$(( (now_epoch - last_epoch) / 60 ))
            echo "$workflow: last successful run $last_run ($gap_min min ago, threshold ${threshold_min}m)"

            if [ "$gap_min" -ge "$threshold_min" ]; then
              echo "$workflow: gap exceeds threshold -- dispatching manually."
              gh workflow run "$workflow" --repo "$REPO" --ref "$REF"
            else
              echo "$workflow: gap is within the normal range -- nothing to do."
            fi
          }

          # Threshold = own cadence + slack for a run landing a bit late.
          #
          # live-scores.yml is the exception: it self-loops for up to 13
          # minutes straight while a match is live (see JOB_BUDGET_MS in
          # syncLiveScores.js), and "last successful run" here means that
          # run's *start* time, not when it finished. Confirmed live
          # (Bayern-Stuttgart, 2026-08-28): with a 25-min threshold, a run
          # that started at :00 and finished at :13 wasn't seen as stale
          # again until :25+ -- a real ~16-minute gap with nobody polling,
          # right as the match hit its 5th goal and full time. A much
          # tighter threshold (just over the run's own ~13-min duration)
          # costs nothing on quiet days -- live-scores.yml exits in ~1-2s
          # when nothing is live -- so there's no reason not to check it
          # aggressively.
          #
          # live-scores/live-events/live-scores-european thresholds are set
          # equal to (not "just over") each job's own JOB_BUDGET_MS, not
          # threshold_min+1. Confirmed live 2026-09-13: with threshold=14 for
          # live-scores (13-min self-loop) and this watchdog itself only
          # getting checked every ~15 min (external cron, since GitHub's own
          # schedule trigger for live-scores.yml/live-events.yml wasn't
          # firing that day either -- same root issue this whole file
          # exists for), a run that started at :01 and finished at :14 left
          # gap_min truncating to exactly 14 at the :15 check -- one minute
          # short of the OLD "$gap_min -gt 14" condition, so that check did
          # nothing and the next chance wasn't until :30, a genuine ~16-min
          # freeze live scores/events users could see stall mid-match. Two
          # independent fixes for the same root cause: the comparison below
          # is now "-ge", not "-gt" (a gap exactly equal to the threshold
          # now counts as stale), and every live-* threshold here dropped by
          # 1 to equal the job's own JOB_BUDGET_MS exactly -- together they
          # guarantee the very first watchdog tick after a run genuinely
          # finishes always re-triggers it, instead of needing a lucky
          # truncation or a whole extra ~15-min cycle. Still safe against a
          # false trigger while a run is legitimately still live: gap can't
          # reach JOB_BUDGET_MS while the job itself is still inside that
          # same budget, and even if it did, live-scores.yml/live-events.yml
          # both already guard against overlap with concurrency groups.
          check_and_trigger news-scraper.yml 50     # cadence 30 min
          # Tightened 25->20 -- confirmed live 2026-09-19 (Roma vs Inter):
          # a genuine ~29min gap between successful runs (16:45:29 ->
          # manual 17:14:42) sat entirely inside the old 25-min threshold
          # until very late, during which a live goal (Inter, 46') went
          # unnotified for ~28 minutes -- lineups-sync.yml is this app's
          # own REST backstop for match events too, not just lineups (see
          # that file's own eventsNeeded()), so a stale gap here isn't
          # just a delayed lineup, it's a delayed goal/card/sub push with
          # no other safety net while syncLiveEvents.js's WS path is also
          # having a quiet spell. 20 is cadence (15) + one tick of slack,
          # same shape as fixture-reminders.yml's own 10 = 2x its 5-min
          # cadence below -- still tolerates one missed native tick before
          # re-triggering, just doesn't wait for two.
          check_and_trigger lineups-sync.yml 20     # cadence 15 min
          check_and_trigger fixture-reminders.yml 10  # cadence 5 min -- sole path for 30/15-min-before-kickoff pushes, see this file's own top comment
          check_and_trigger live-events.yml 14      # self-loops ~14 min while live -- see this file's own top comment
          check_and_trigger live-scores.yml 13      # self-loops ~13 min while live; see comment above
          check_and_trigger live-scores-european.yml 13  # same self-loop shape as live-scores.yml
          check_and_trigger fixtures-sync.yml 400   # cadence 360 min (4x/day)
          check_and_trigger highlights-sync.yml 50  # cadence 30 min
