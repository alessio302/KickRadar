name: Fixtures sync

on:
  schedule:
    # Hourly, not the original 4x/day (per the briefing's "3-4 Abfragen pro
    # Liga und Tag reichen"). User-reported (2026-09-06): referees weren't
    # showing up even once a fixture's lineup was already confirmed.
    # Confirmed live via a diagnostic (diagnoseMissingReferee.js, since
    # removed): football-data.org's own referees[] for 4 same-day matches
    # was still empty at the 09:11 UTC run, but fully populated by 12:57 --
    # assigned somewhere in that ~4h pre-kickoff window. At 4x/day
    # (05/11/17/23 UTC), the next scheduled run after 09:11 was 17:00 --
    # AFTER all four matches (13:00 kickoff) had already finished, so the
    # referee only ever appeared post-match even though the data had been
    # available for hours before kickoff. Hourly shrinks that gap to under
    # an hour in the worst case. football-data.org's free tier is
    # rate-limited per-minute (10 req/min), not per-day, so this (5 leagues
    # x 24 runs = 120 req/day, well spaced) costs nothing extra.
    - cron: '5 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/syncFixtures.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
