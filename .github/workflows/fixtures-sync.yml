name: Fixtures sync

on:
  schedule:
    # 4x/day, per the briefing ("3-4 Abfragen pro Liga und Tag reichen").
    #
    # Referee freshness (briefly chased here at an hourly cadence, then via
    # a dedicated call in syncLineups.js, 2026-09-06) is now piggybacked
    # onto syncLiveScores.js's own already-frequent per-league polling (see
    # that file's own pollOnce() comment) at zero extra football-data.org
    # requests -- this job's own cadence only needs to matter for matchday/
    # status/score drift outside syncLiveScores.js's live-window polling.
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/syncFixtures.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
