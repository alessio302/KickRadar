name: Fixtures sync

on:
  schedule:
    # 4x/day, per the briefing ("3-4 Abfragen pro Liga und Tag reichen").
    #
    # Briefly bumped to hourly (2026-09-06) to chase a referee-freshness
    # gap -- reverted back down now that syncLineups.js's own 15-min
    # near-kickoff pass fetches referee directly (see that file's own
    # syncRefereesForCandidates() comment), which closes the same gap far
    # tighter than this whole-season job ever could. This job's own
    # cadence only needs to matter for matchday/status/score drift that
    # syncLiveScores.js's live-window polling doesn't already cover.
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/syncFixtures.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
