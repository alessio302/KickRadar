name: Cleanup garbage player names (one-off)

# One-off cleanup (see src/news/cleanupPlayerNames.js) -- manual trigger
# only. Defaults to a dry run (prints what would be deleted, changes
# nothing); check "Execute delete" to actually delete.
on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Actually delete (unchecked = dry run only)'
        type: boolean
        default: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/cleanupPlayerNames.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXECUTE: ${{ inputs.execute }}
