name: Lineups sync

on:
  schedule:
    # Every 15 min: lineups become available close to kickoff (confirmed
    # live around actual kickoff time, not strictly the "30 min before"
    # Highlightly's docs describe) -- hourly like the news scraper used to
    # run would easily miss the ~45-minute window entirely depending on
    # kickoff time. Running this often (96 runs/day, ~2,880/month even if
    # every run were instant, since GitHub Actions bills whole minutes per
    # job) needs the repo to be public -- a private repo's free tier is
    # only 2,000 min/month total, and this alone would likely exceed it.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/lineups/syncLineups.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
