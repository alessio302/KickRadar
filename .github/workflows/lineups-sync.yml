name: Lineups sync

on:
  schedule:
    # Every 15 min: lineups become available close to kickoff (confirmed
    # live around actual kickoff time, not strictly the "30 min before" a
    # provider's own docs describe) -- hourly like the news scraper used to
    # run would easily miss the ~45-minute window entirely depending on
    # kickoff time. Running this often (96 runs/day, ~2,880/month even if
    # every run were instant, since GitHub Actions bills whole minutes per
    # job) needs the repo to be public -- a private repo's free tier is
    # only 2,000 min/month total, and this alone would likely exceed it.
    #
    # Offset to :14/:29/:44/:59, not the round :00/:15/:30/:45 marks -- see
    # news-scraper.yml's schedule comment: three workflows sharing the
    # literal "*/15 * * * *" pattern caused GitHub Actions' scheduler to
    # throttle them hard (confirmed live via run history: average gap
    # ~70 min instead of 15, up to 5+ hours). Staggering the minutes apart
    # is the standard mitigation.
    - cron: '14,29,44,59 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    # Bumped from 10: syncLineups.js now also catches up on past-fixture
    # lineups and events within the app's display window (see its own
    # PAST_WINDOW_DAYS comment), not just the near-kickoff window -- the
    # first run after this landed has a real backlog to clear (46 missing
    # lineups at last count). Steady-state runs finish in well under a
    # minute once that backlog is gone, same as news-scraper.yml's own
    # 10->20 bump for the same reason.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/lineups/checkLiveMinute.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
