name: Diagnose Serie A clubs vs fixtures

# One-off diagnostic (see src/football-api/diagnoseSerieAClubs.js) --
# manual trigger only. Cross-checks the clubs table against clubs that
# actually appear in synced fixtures, to catch stale rows syncClubs.js's
# upsert-only logic would never clean up on its own.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/diagnoseSerieAClubs.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
