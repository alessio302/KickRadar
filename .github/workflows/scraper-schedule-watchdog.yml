name: Scraper schedule watchdog

# GitHub Actions' own scheduled-trigger delivery has been unreliable for
# this repo -- confirmed live on 2026-08-28: news-scraper.yml (and, at the
# same time, lineups-sync.yml and live-scores.yml) silently stopped firing
# on its own schedule for ~7 hours despite being an "active" workflow with
# no code/secrets problem; a manual workflow_dispatch worked fine every
# single time and pulled in real new items. GitHub documents scheduled
# triggers as best-effort, and this is outside anything fixable in our own
# code. This watchdog is the workaround: runs hourly (independent of
# news-scraper's own schedule, so it doesn't share a single point of
# failure with it) and re-triggers news-scraper.yml by hand if its last
# successful SCHEDULED run looks suspiciously old.
#
# Scoped to news-scraper.yml only for now, even though lineups-sync.yml
# and live-scores.yml showed the exact same symptom that day -- can be
# extended to watch those too if it keeps happening.
#
# This watchdog's own hourly schedule is subject to the identical GitHub
# reliability issue -- it isn't a way around the root cause, since nothing
# we control is. But it doesn't need every tick to land: whenever it *does*
# eventually fire, even hours late, it immediately catches up regardless of
# how long the gap was, rather than depending on a person noticing and
# re-running it by hand (as happened twice today).
#
# Offset to :50 -- doesn't collide with news-scraper's own :04/:34,
# live-scores' :09/:24/:39/:54, or lineups-sync's :14/:29/:44/:59.
on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check last scheduled news-scraper run and re-trigger if stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          LAST_RUN=$(gh api "repos/$REPO/actions/workflows/news-scraper.yml/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].created_at // empty')

          if [ -z "$LAST_RUN" ]; then
            echo "No prior successful scheduled run found -- nothing to compare against, skipping."
            exit 0
          fi

          LAST_EPOCH=$(date -u -d "$LAST_RUN" +%s)
          NOW_EPOCH=$(date -u +%s)
          GAP_MIN=$(( (NOW_EPOCH - LAST_EPOCH) / 60 ))
          echo "Last successful scheduled news-scraper run: $LAST_RUN ($GAP_MIN min ago)"

          # 50 min, not 30 -- news-scraper's own cadence is 30 min, so this
          # gives real runs a bit of slack (a run can legitimately land a
          # few minutes late) before treating the gap as actually stuck.
          if [ "$GAP_MIN" -gt 50 ]; then
            echo "Gap exceeds 50 min -- dispatching news-scraper.yml manually."
            gh workflow run news-scraper.yml --repo "$REPO" --ref "${{ github.ref_name }}"
          else
            echo "Gap is within the normal range -- nothing to do."
          fi
