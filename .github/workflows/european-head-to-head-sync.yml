name: European head-to-head sync

on:
  schedule:
    # Down from 4x/day (2026-09-15): unlike its domestic counterpart
    # (head-to-head-sync.yml, football-data.org -- a separate, not
    # currently strained budget), this job spends GOAL API requests, the
    # same shared 1000/day pool that's already been measured going over
    # cap on real match days. H2H data isn't remotely time-critical --
    # nobody is waiting in real time for "last 5 meetings" to update the
    # moment a match ends -- so once a day is exactly as useful to a user
    # as 4x/day was, at a quarter of the cost. Offset to :45, distinct
    # from every other cron here (see highlights-sync-european.yml's own
    # comment for the full list of minutes already in use).
    - cron: '45 5 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/syncEuropeanHeadToHead.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
