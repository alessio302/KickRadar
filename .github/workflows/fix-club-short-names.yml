name: Fix club short names (one-off)

# Applies syncClubs.js's SHORT_NAME_OVERRIDES to clubs already in the DB
# right now, so the fix shows up immediately instead of waiting for the
# next clubs-sync run. See src/football-api/fixClubShortNames.js.
on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/fixClubShortNames.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
