name: Standings sync

on:
  schedule:
    # Same 4x/day cadence as fixtures-sync -- standings only change once a
    # match finishes. Offset 20 min off fixtures-sync's own :00 slots to
    # avoid the scheduler throttling multiple workflows sharing identical
    # cron minutes (see news-scraper.yml's history for the confirmed cause).
    - cron: '20 5,11,17,23 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/diagnoseSkySportsLiveBlogMarkup.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
