name: Standings sync

on:
  schedule:
    # Down from 4x/day (2026-09-12): syncLiveScores.js now calls this same
    # sync itself, for exactly the league(s) that just had a fixture reach
    # 'finished', within its own ~2min poll cadence during a live window --
    # standings update within minutes of full time, not on the next of this
    # cron's own fixed windows. That leaves this cron as a pure safety net
    # for whatever that path misses entirely (the whole live-scores.yml job
    # failing to run that day, etc.), so once a day is plenty --
    # syncStandingsForLeague()'s own finished-fixture-count guard means an
    # already-caught-up league still costs zero football-data.org calls,
    # just one cheap Supabase count check per league.
    - cron: '20 5 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/syncStandings.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
