name: Clean up same-club transfer cards (one-off)

# Deletes existing transfers rows where from/to resolved to the same club
# (mis-extracted non-transfer stories, e.g. contract renewals) -- see
# src/news/cleanupSameClubTransfers.js. Writes to the DB, manual trigger
# only.
on:
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/cleanupSameClubTransfers.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
