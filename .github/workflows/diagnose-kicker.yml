name: Diagnose kicker.de lineup API

# One-off diagnostic (see src/lineups/diagnoseKicker.js) -- manual trigger
# only, no schedule. Dumps raw data so the real lineup sync can be built
# against confirmed field values instead of guesses.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/lineups/diagnoseKicker.js
