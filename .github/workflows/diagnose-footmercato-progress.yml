name: Diagnose Foot Mercato progress (one-off)

# Checks how much of footmercato's backlog made it into the DB before the
# manually-triggered news-scraper run hit its 20-min timeout (a concurrent
# Gemini 503 outage slowed every extraction call way down) -- see
# src/news/diagnoseFootmercatoProgress.js. Read-only, no DB writes.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/diagnoseFootmercatoProgress.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
