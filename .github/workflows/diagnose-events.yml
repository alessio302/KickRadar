name: Diagnose Highlightly match events (one-off)

# Read-only: checks whether Highlightly exposes a match-events endpoint
# (goals/cards/subs), needed to scope the "favorite a match, get pushed on
# its events" feature honestly before building it. No writes. Manual
# trigger only, to be deleted after use.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/lineups/diagnoseEvents.js
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
