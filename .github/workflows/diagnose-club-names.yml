name: Diagnose club names (one-off)

# Read-only: dumps every club name in the DB to cross-check against
# clubKitColors.js's keys for gaps (confirmed live: Valencia CF was
# missing, rendering with the theme-border fallback instead of real kit
# colors). No writes. Manual trigger only, to be deleted after use.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/diagnoseClubNames.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
