name: Fix stale Vitinha/Rennes transfers row (one-off)

# Corrects the one pre-fix transfers row still showing Vitinha as
# PSG -> Stade Rennais; the real article has him at Genoa. See
# src/news/fixVitinhaRennesRow.js. Single-row update, guarded by a
# pre-check that the row still matches the expected stale state.
on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/fixVitinhaRennesRow.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
