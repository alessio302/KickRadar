name: Diagnose Transfermarkt search result structure (one-off)

# Inspects transfermarkt.de's quicksearch result-page HTML for a few
# known-ambiguous names, so playerProfileResolver.js's planned
# disambiguation logic (pick the search result whose current club matches
# the article's already-known club, instead of blindly taking the first
# hit) can be built against real markup. See src/news/diagnoseTransfermarktSearch.js.
# Read-only, no DB writes.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/diagnoseTransfermarktSearch.js
