name: Remove leftover RMC Sport Ligue 1 rows (one-off)

# Deletes the rmcsport-sourced Ligue 1 transfer rows now that
# footmercato.js is the sole source, per user request -- see
# src/news/removeRmcLigue1Rows.js. Writes to the transfers table
# (delete only, scoped to league_id=ligue-1 and source=rmcsport).
on:
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/removeRmcLigue1Rows.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
