name: Diagnose Ligue 1 freshness (one-off)

# Checks why Ligue 1's newest transfer card looked 3 days old despite a
# recent scrape run inserting new rows -- see
# src/news/diagnoseLigue1Freshness.js. Read-only, no DB writes.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/diagnoseLigue1Freshness.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
