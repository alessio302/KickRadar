name: Cleanup duplicate transfers v2 (one-off)

# Merges/deletes the exact duplicate rows confirmed by
# find-dupes-v2.yml -- see src/news/cleanupDuplicateTransfersV2.js for the
# hardcoded id list and reasoning. Manual trigger only, to be deleted
# after use.
on:
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/cleanupDuplicateTransfersV2.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
