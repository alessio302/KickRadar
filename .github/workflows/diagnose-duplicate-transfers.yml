name: Find duplicate transfer cards (one-off)

# Read-only diagnostic (no DB writes) to list transfers rows that the old
# id-only dedup gate in runNewsScraper.js missed -- see
# src/news/findDupes.js. Manual trigger only.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/findDupes.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
