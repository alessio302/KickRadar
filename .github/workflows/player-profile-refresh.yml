name: Player profile refresh

on:
  schedule:
    # Monthly, on the 1st at :49 -- moved down from every 6 hours so this
    # job stops competing with live coverage for GOAL API budget on match
    # days. Stats and club changes for already-resolved players are still
    # picked up, just once a month. See refreshPlayerProfiles.js's own
    # BATCH_SIZE comment for the batch size per run.
    - cron: '49 1 1 * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 15 players x ~6.5s GOAL API spacing (1 call each, no search step) is
    # well under a minute in the fast case; generous headroom for retries
    # during a busy rate-limit window.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/news/refreshPlayerProfiles.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
