name: List clubs (one-off)

# Read-only diagnostic: dumps every synced club's exact name/short_code
# per league, needed to build a curated kit-color map keyed against real
# data -- see src/football-api/listClubs.js. Manual trigger only.
on:
  workflow_dispatch: {}

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/listClubs.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
