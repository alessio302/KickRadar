name: Diagnose venue/referee fields (one-off)

# Checks whether football-data.org's /competitions/{id}/matches response
# includes venue/referee data -- see src/football-api/diagnoseVenueReferee.js.
# Read-only, no DB writes. Manual trigger only.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/football-api/diagnoseVenueReferee.js
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
